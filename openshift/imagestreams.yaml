# Base image for the Dockerfile's runtime stage, and the image the build produces.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: openjdk-17-runtime
  labels:
    app: neet-chat
spec:
  lookupPolicy:
    local: false
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/openjdk-17-runtime:latest
      importPolicy:
        importMode: Legacy
      referencePolicy:
        type: Source
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: neet-chat
  labels:
    app: neet-chat
spec:
  lookupPolicy:
    local: false

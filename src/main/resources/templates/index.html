<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEET Paper Coach</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #182821;
            --muted: #64736a;
            --green: #205c43;
            --green-dark: #164632;
            --paper: #fffefa;
            --line: #e5e9e3;
            --wash: #f3f6f0;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--wash);
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.55;
        }
        header {
            border-bottom: 1px solid var(--line);
            background: var(--paper);
        }
        .topbar, main {
            width: min(860px, calc(100% - 36px));
            margin: 0 auto;
        }
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 0;
            font-weight: 700;
            letter-spacing: -.02em;
        }
        .mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 12px;
            background: var(--green);
            color: white;
            font-size: 14px;
        }
        main { padding: 64px 0 80px; }
        .eyebrow {
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        h1 {
            max-width: 650px;
            margin: 10px 0 12px;
            font-size: clamp(34px, 6vw, 52px);
            letter-spacing: -.045em;
            line-height: 1.08;
        }
        .intro {
            max-width: 610px;
            margin: 0 0 30px;
            color: var(--muted);
            font-size: 17px;
        }
        .question-card, .result-card {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--paper);
            box-shadow: 0 12px 36px rgb(31 54 41 / 5%);
        }
        .question-card { padding: 22px; }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 650;
        }
        textarea {
            display: block;
            width: 100%;
            min-height: 112px;
            resize: vertical;
            border: 1px solid #d8dfd8;
            border-radius: 11px;
            padding: 14px;
            color: var(--ink);
            font: inherit;
            outline: none;
        }
        textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgb(32 92 67 / 12%);
        }
        .form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 15px;
        }
        .hint { color: var(--muted); font-size: 13px; }
        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 19px;
            background: var(--green);
            color: white;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }
        button:hover { background: var(--green-dark); }
        .result-card { margin-top: 24px; padding: 24px; }
        h2 { margin: 0 0 14px; font-size: 19px; }
        .asked-question {
            margin: 0 0 18px;
            padding-left: 14px;
            border-left: 3px solid #9ab8a6;
            color: var(--muted);
        }
        .answer { white-space: pre-wrap; }
        .sources {
            margin: 22px 0 0;
            padding: 17px 0 0;
            border-top: 1px solid var(--line);
            list-style: none;
        }
        .sources li { margin-top: 6px; color: var(--muted); font-size: 13px; }
        .error {
            margin: 0 0 18px;
            border: 1px solid #c62828;
            border-left: 6px solid #c62828;
            border-radius: 12px;
            padding: 14px 16px;
            background: #fff3f2;
            color: #8f1d1d;
            font-weight: 700;
            display: block;
            box-shadow: 0 8px 20px rgba(198, 40, 40, 0.08);
        }
        @media (max-width: 560px) {
            main { padding-top: 42px; }
            .form-footer { align-items: stretch; flex-direction: column; }
            button { width: 100%; }
            .question-card, .result-card { padding: 18px; }
        }
    </style>
</head>
<body>
<header>
    <div class="topbar">
        <span class="mark" aria-hidden="true">N+</span>
        <span>NEET Paper Coach</span>
    </div>
</header>
<main>
    <div class="eyebrow">Learn from past papers</div>
    <h1>Make every NEET question a learning moment.</h1>
    <p class="intro">Ask about a question or concept. Get a clear explanation grounded in the indexed NEET papers and solutions.</p>

    <div class="error" role="alert" th:if="${error}" th:text="${error}"></div>

    <form class="question-card" method="post" action="/ask">
        <label for="question">What would you like help with?</label>
        <textarea id="question" name="question" maxlength="1000" required
                  placeholder="For example: Explain why the answer to the 2023 question about electric potential is option B."
                  th:text="${question}"></textarea>
        <div class="form-footer">
            <span class="hint">Answers are based on the papers in your Questions folder.</span>
            <button type="submit">Get an explanation <span aria-hidden="true">→</span></button>
        </div>
    </form>

    <section class="result-card" aria-live="polite" th:if="${answer}">
        <h2>Study answer</h2>
        <p class="asked-question" th:text="${question}"></p>
        <div class="answer" th:text="${answer}"></div>
        <ul class="sources" th:if="${not #lists.isEmpty(sources)}">
            <li th:each="source : ${sources}">
                <strong th:text="|[${source.reference()}]|"></strong>
                <span th:text="|${source.paper()}, page ${source.page()}|"></span>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
